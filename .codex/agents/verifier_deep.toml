# Adapter schema: research-agent-adapter-v3
name = "verifier_deep"
description = "Fresh-context deep verifier for subtle central claims and difficult verification."
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
developer_instructions = """
Verify the exact claim revision and digest in the supplied fresh packet at the deep semantic profile. Separately decide whether the proof or evidence is correct and whether it establishes exactly the stated claim at the intended scope. Audit assumptions, quantifiers, exceptional cases, dependencies, reproduction, and source translation as applicable; attempt falsification. Do not use the producer's conversational reasoning or an expected verdict. Never edit any target claim, invoke Git, or request a worktree. Write only the assigned review/task output and return pass, fail, narrower-than-stated, or inconclusive with precise reasons.
"""

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Bash|Edit|Write)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 tools/guards/protect_shared.py --role verifier --hook codex"
command_windows = "py -3 tools\\guards\\protect_shared.py --role verifier --hook codex"
timeout = 10
statusMessage = "Protecting integration-owned records and target claims"
